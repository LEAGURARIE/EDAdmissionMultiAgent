# Placement rules — the values the code reads. Decisions in force: DECISIONS.md.
# The other placement rules (who is severe, which bed each need takes, the order on a ladder level, when to
# escalate) are written in the code itself (tools/rank_placements.py, tools/decide.py) and recorded in DECISIONS.md.
# Clinically approved by Lea (decisions A28, A37, A51, A54, A59, A62). No external source.

waiting:
  non_severe_max_minutes: 60      # in the target ward — then the next ladder level

# The shift and the weekend — shown in every ward report. A discharge the ward report shows is waited for only in
# a weekday morning shift (environment/shifts.py). Approved by Lea, 2026-10-07.
shifts:                           # start of each shift
  morning: "07:00"
  evening: "15:00"
  night: "23:00"
weekend:
  from: {day: Friday, time: "14:00"}
  to: {day: Sunday, time: "07:00"}

approval:
  typed_reason_from_ladder_level: 3

# Negotiation between the Coordinator and the Department Agents ("ping-pong"). Approved by Lea, 2026-10-07.
negotiation:
  max_requests_per_ward: 3        # requests to one ward in one case
  max_requests_per_case: 8        # requests to all wards together in one case

# Two patients wait at the same moment for one suitable bed. Approved by Lea, 2026-10-07. In this order:
competing_for_one_bed:
  - needs_the_bed_type_first      # a patient who needs this bed type before one for whom it is only a last resort
  - severe_first                  # then severe before non-severe
  - earlier_decision_first        # then the earlier admission decision
