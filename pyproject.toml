[project]
name = "ed-admission"
version = "0.1.0"
description = "Multi-agent system for Emergency Department admission placement in a simulated adult hospital"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ed_admission = ["prompts/*.md"]
