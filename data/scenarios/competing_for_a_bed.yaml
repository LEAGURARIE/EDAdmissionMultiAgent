# Scripted day 4 — competing for a bed: three moments when two patients need the same bed, built on the approved
# rule for two patients and one bed. Synthetic data only. Admission events carry only the time and the patient id;
# what the patients need the decider must read in their records. Which patient should get each bed is never
# written here.

