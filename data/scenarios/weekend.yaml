# Scripted day 3 — the weekend: few discharges; beds the on-call physician freed are not updated until Sunday.
# Synthetic data only. Admission events carry only the time and the patient id; what the patient needs comes from
# the medical record, never from the scenario. Ward notes are private: only that ward's Department Agent reads them.
# Times after midnight are written like 01:00 +1d.

name: weekend
description: Friday afternoon to Saturday night — 12 admissions, few discharges, freed beds not updated
day: Friday
start_time: "14:00"

# Every bed starts occupied, except these. Beds: 1-10 regular, 11-12 observation, 13 isolation room;
# intensive care 1-6, 7 isolation room.
free_at_start:
  internal_medicine_a: [1, 13]
  internal_medicine_b: [1]
  cardiology: [11]
  general_surgery: [1, 2]

