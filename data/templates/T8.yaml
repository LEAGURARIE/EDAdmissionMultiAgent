# T8 — weekend, little room. Design: docs/design/ward_state_templates.md.
# Saturday. The target ward is full with no discharge today; level 2 has the last free beds and a held one;
# farther wards are full. Private note: two beds were freed this morning and are not updated until Sunday.
id: T8
name: סוף שבוע, מעט מקום
day: Saturday
time: "14:00"
relative_to: target_ward

default:
  regular_free: 0
  observation_free: 0
  isolation_free: false

ladder:
  level_1:
    regular_free: 0
    observation_free: 0
    isolation_free: false
    notes:
      - "שבת. הכונן שחרר בבוקר שני מטופלים, ממיטה רגילה 1 וממיטת השגחה 11. המיטות נקיות ופנויות, המזכירה תעדכן רק ביום ראשון."
    note_effects:
      - {effect: hidden_free, bed_type: regular, bed: 1}
      - {effect: hidden_free, bed_type: observation, bed: 11}
  level_2:
    regular_free: 1
    observation_free: 1
    isolation_free: false
    held:
      - {bed_type: regular}

intensive_care:
  intensive_care_free: 1
  isolation_free: true
