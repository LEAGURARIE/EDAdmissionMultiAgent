      - "בחדר הבידוד הלחץ השלילי לא עובד מהבוקר, החדר סגור."
    note_effects:
      - {effect: unavailable, bed_type: isolation}

intensive_care:
  intensive_care_free: 1
  isolation_free: true
  notes:
    - "המיטה הפנויה שמורה למטופל מחדר ניתוח, מגיע בעוד שעה."
  note_effects:
    - {effect: unavailable, bed_type: intensive_care}
