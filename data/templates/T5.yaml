# Level 2 has a free regular bed and a free observation bed.
# Private notes: another regular bed is free but not yet updated; level 2 has no nurse for its observation bed.
id: T5
name: מיטה בניקוי
day: Tuesday
time: "13:00"
relative_to: target_ward

default:                          # every regular ward not set below
  regular_free: 2
  observation_free: 1
  isolation_free: true

ladder:
