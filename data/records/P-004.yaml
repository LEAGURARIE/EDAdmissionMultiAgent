physician_note: |
  בן 63 DM2, היפרליפידמיה, BPH. חום עד 39.2 וצמרמורות מאתמול, לדבריו "כנראה תפס משהו מהנכדים" שחזרו
  מהגן עם הצטננות. בשבוע שעבר עבד הרבה בגינה, בחודש שעבר טיול בצפון איטליה היה בריא כל הטיול. לפני
  שנתיים כריתת פוליפ בקולונוסקופיה לא ממאיר. חיסונים עדכניים לדבריו. אשתו בבית חולה בשפעת מאובחנת
  מתחילת השבוע, הוא עצמו עם מעט שיעול יבש. שואל אם אפשר לקבל אנטיביוטיקה הביתה כי יש לו טיסה
  לחתונה של אחיינית בשבוע הבא, מאוד מוטרד מזה. ללא שלשולים, ללא תלונות שתן.
  בתשאול ממוקד - כאב בבטן עליונה ימנית יומיים, החמיר אחרי ארוחה שמנה, בחילה ללא הקאות.
  ב.ג. נראה חולה, ללא צהבת, ריאות נקיות, רגישות ניכרת RUQ מרפי חיובי.
  US: כיס מרה מעובה עם אבנים ונוזל פריכולציסטי - acute cholecystitis. לקטט 3.1, תרביות דם נלקחו.
  PCR שפעת נלקח לאור החשיפה בבית + השיעול, תשובה ממתינה - לשלול שפעת
  ceftriaxone + metronidazole + נוזלים. נבדק ע"י כירורג תורן ממליץ טיפול שמרני ראשוני ושקילת ניתוח

  לאשפוז
