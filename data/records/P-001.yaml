physician_note: |
  בת 68 ידועה HTN, היפותירואידיזם, הגיעה בגלל חולשה וסחרחורת 3 ימים, מאוד חרדה. תוך כדי שיחה מספרת
  שבעלה אושפז השבוע בטנ"מ לב אחרי אוטם והיא "רוצה לוודא שגם לה אין התקף לב". שוללת כאב חזה, שוללת
  קוצר נשימה, שוללת דפיקות לב, ללא עילפון. בתשאול נוסף - צריבה במתן שתן ותכיפות כמה ימים, לא סיפרה
  בהתחלה. ללא חום בבית לדבריה. ב.ג. במ"כ טוב, מעט מיובשת, לב סדיר ללא אוושות, ריאות נקיות דו"צ,
  בטן רכה רגישות קלה סופרה-פובית, ניקוש מותני שלילי בשני הצדדים. ECG סינוס ללא שינויי ST
  טרופונין 6 - תקין. בשתן לויקוציטים + ניטריטים חיוביים, נשלחה תרבית. Cr 1.3 (לא נמצא ערך קודם)
  קיבלה נוזלים iv + ceftriaxone, מרגישה יותר טוב, פחות חרדה אחרי שהוסבר לה שאין עדות לבעיה לבבית

  UTI + התייבשות קלה עם עליה קלה בקריאטינין, ללא עדות ל-ACS. לאשפוז בפנימית להמשך אנטיביוטיקה iv ונוזלים
