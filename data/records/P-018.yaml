physician_note: |
  בן 45 ללא רקע. כאב בחזה מימין 4 ימים, דוקר, מחמיר בנשימה עמוקה ובשיעול. עובד כמהנדס בחברת בנייה,
  בשנה האחרונה עבד בפרויקט בדרום אפריקה וחזר לפני חודשיים, בדרך עשה טיול בתאילנד של שבועיים ללא בעיות.
  לפני 3 חודשים נפל מפיגום, כאבי גב שחלפו, ללא צילום. אשתו בהריון בחודש שישי, מאוד מודאג שידביק אותה.
  מעשן בעבר 5 שנים, הפסיק לפני 10 שנים. מתאמן בחדר כושר 3 פעמים בשבוע, לאחרונה "אין כוח".
  ECG סינוס ללא שינויי ST, טרופונין 4 - תקין, D-dimer גבולי, CTA - ללא PE. בתשאול חוזר שיעול
  כחודש וחצי לסירוגין, לפעמים עם פסים של דם, הזעות לילה, ירד כ-5 ק"ג "בגלל הלחץ בעבודה".
  CTA - בנוסף תסנין באונה עליונה ימנית עם חלל 2 ס"מ. סט' 91% באוויר, הוחל O2 1L - 95%.
  כיח ל-AFB x3 נשלח, הוחל בידוד אוויר במיון, לשלול TB

  כאב חזה פלאוריטי, ACS ו-PE נשללו. חשד ל-TB ריאתי עם חלל. לאשפוז
