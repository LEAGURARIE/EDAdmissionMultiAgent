physician_note: |
  בת 81 HTN דיכאון. הבת מספרת שבחודש האחרון אמא "שותה המון מים כי קראה שזה בריא", כ-4 ליטר ביום, ומאז
  שהתחילה sertraline לפני 6 שבועות פחות תיאבון. השבוע הרגישה חולשה, בחילה, לא יצאה לחוג התעמלות שהיא
  מאוד אוהבת, ונכדה ביקר וחשב שהיא "קצת מפוזרת". גרה לבד, עצמאית לגמרי, נוהגת. לפני חצי שנה בדיקות דם
  תקינות אצל רופאת המשפחה, Na 136. הבוקר נמצאה ע"י הבת מבולבלת, לא זיהתה אותה לרגע. בדרך למיון
  באמבולנס - פרכוס כללי של כדקה, חלף. במיון מבולבלת, ללא חסר מוקדי. Na 112, אוסמולליות פלזמה נמוכה,
  נתרן בשתן נמוך. CT ראש - ללא ממצא חריף. הופסקו HCTZ ו-sertraline, הגבלת נוזלים. אחרי הפרכוס ניתן
  בולוס סליין היפרטוני 3% 100ml. נדרש ניטור נתרן כל שעתיים ועירוי היפרטוני מבוקר

  היפונתרמיה קשה סימפטומטית עם פרכוס. יש לאשפז בטיפול נמרץ, דובר עם התורן
