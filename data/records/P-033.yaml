  אשתו נפטרה לפני שנה - הבן חושש מדיכאון. בתשאול ממוקד: קוצר נשימה ולחץ בחזה
  בעלייה במדרגות, הולך ומחמיר בחודש האחרון. ב.ג. אוושה סיסטולית 4/6 בבסיס עם הקרנה לצוואר,
  S2 חלש. ECG - LVH. TTE ליד המיטה: AS קשה, AVA ~0.7 סמ"ר, גרדיאנט ממוצע 48, EF שמור. trop 18 ללא
  דינמיקה. ללא אורתוסטזיס. במנוחה ללא תלונות

  AS קשה סימפטומטית, לבירור לקראת TAVI. לאשפוז
