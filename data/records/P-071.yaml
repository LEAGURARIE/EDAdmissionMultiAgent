physician_note: |
  בת 66, היפותירואידיזם. התעלפה בעמידה ארוכה בתור בחום, לפני כן הרגישה חום, בחילה והזעה, "השחיר לה".
  נפלה לאט, התעוררה תוך פחות מדקה, ללא בלבול אחר כך, ללא נשיכת לשון, ללא כאב חזה או דפיקות לב.
  סינקופה, לא ברור - לשלול סיבה קרדיאלית, להשגחה עם מוניטור. (ד"ר כהן, מתמחה)
  ---
  בכיר, 4 שעות אחרי: עברתי על המקרה. ECG סינוס 70, PR ו-QT תקינים, ללא חסימות. אקו ליד המיטה - תפקוד
  תקין, ללא מחלה מסתמית. טרופונין 4 ו-5, שלילי פעמיים. במוניטור 4 שעות - סינוס בלבד. אורתוסטטי שלילי.
  פרודרום מובהק בעמידה בחום - סינקופה וזו-וגאלית. אין צורך במוניטור ולא בהשגחה. מיטה רגילה, להשלים
  הולטר אמבולטורי. נשארת לאשפוז קצר כי גרה לבד והבת בחו"ל. (ד"ר לוי, בכיר)

  סינקופה וזו-וגאלית, ללא עדות לסיבה קרדיאלית. לאשפוז בפנימית
