physician_note: |
  בת 70 HTN על HCTZ, היפותירואידיזם. 3 ימים הקאות ושלשולים מימיים כ-6 ביום, לא מצליחה לשתות, חולשה.
  כל המשפחה הייתה בחתונה בשבוע שעבר, כמה מהאורחים עם שלשולים. מאוד דואגת - הנכד שלה בן 19 מאושפז
  מאתמול בטיפול נמרץ עם דלקת קרום המוח, המשפחה אמרה לה שאולי צריך "לבדוק את כולם". לא הייתה בקשר עם
  הנכד מעל שבועיים, הוא גר בעיר אחרת. שוללת חום, שוללת כאב ראש, שוללת קשיון עורף, שוללת פריחה.
  ב.ג. מיובשת, ערנית, ללא סימני גירוי מנינגיאלי, בטן רכה רגישות קלה מפושטת. Cr 1.6 (0.9 בבסיס), K 3.2, Na 131
  נוזלים iv + תיקון K, הופסק HCTZ. דובר עם היחידה למניעת זיהומים לגבי הנכד - לא נדרש טיפול מונע,
  ללא מגע קרוב

  גסטרואנטריטיס עם התייבשות ופגיעה כלייתית חריפה. לאשפוז
