physician_note: |
  בן 76 HTN, OA בברכיים, דמנציה קלה, מלווה ע"י אשתו. חולשה כללית שבוע, אשתו אומרת שפחות אוכל ופחות יוצא
  לטייל עם הכלב, היה פעיל מאוד עד לאחרונה, משחק שש-בש כל ערב עם השכן. לפני יומיים החליק בבית כשקם בלילה
  לשירותים, ללא חבלת ראש, קם לבד. לפני חודש ביקור אצל אורתופד בגלל הברכיים - הומלץ ibuprofen 3 פעמים
  ביום, לוקח באדיקות. בעבר TURP, ללא תלונות שתן כרגע. אשתו מספרת גם שהשבוע "הצואה שלו שחורה כמו
  זפת", חשבה שזה מתוסף ברזל שלקח פעם אבל לא לקח מזה שנה. ב.ג. חיוור, בטן רכה ללא רגישות, רקטלית
  מלנה. Hb 8.4 (12.9 לפני 4 חודשים), BUN מוגבר. אורתוסטטי חיובי - עלייה בדופק ל-118 בעמידה.
  הוחל פנטופרזול iv, הוזמנו 2 מנות דם, הופסק ibuprofen. גסטרו - גסטרוסקופיה מחר בבוקר

  דימום ממערכת העיכול העליונה על רקע NSAIDs, כרגע יציב. לאשפוז בפנימית
